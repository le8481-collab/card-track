<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f4ef">
<title>帳單管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f4ef;
  --bg2: #f0ece4;
  --surface: #ffffff;
  --surface2: #f7f4ef;
  --border: #e8e2d9;
  --border2: #d9d2c5;
  --ink: #2c2826;
  --ink2: #6b6460;
  --ink3: #a89f98;
  --ink4: #c8c0b8;
  --sage: #7a9e8e;
  --sage-light: #e8f0ec;
  --sage-mid: #b8d4c8;
  --rust: #c4755a;
  --rust-light: #f5ece8;
  --amber: #c49a4a;
  --amber-light: #f5edd8;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: calc(72px + var(--safe-bottom));
  font-weight: 300;
}

/* ── LOGIN ── */
#loginScreen {
  position: fixed; inset: 0; z-index: 50;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 32px;
}
#loginScreen.hidden { display: none; }
.login-mark {
  width: 56px; height: 56px;
  border: 1.5px solid var(--border2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; margin-bottom: 28px;
  background: var(--surface);
}
.login-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 22px; font-weight: 600;
  letter-spacing: 2px; margin-bottom: 10px;
  color: var(--ink);
}
.login-sub {
  font-size: 13px; color: var(--ink3);
  margin-bottom: 48px; text-align: center;
  line-height: 1.8; letter-spacing: .5px;
}
.btn-google {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border2); border-radius: 4px;
  padding: 14px 28px; font-size: 14px; font-weight: 400;
  cursor: pointer; width: 100%; max-width: 300px;
  justify-content: center;
  font-family: 'Noto Sans TC', sans-serif;
  letter-spacing: .5px;
  transition: background .15s, border-color .15s;
}
.btn-google:active { background: var(--bg2); }
.btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }
.login-note { font-size: 11px; color: var(--ink4); margin-top: 20px; text-align: center; letter-spacing: .3px; }

/* ── APP ── */
#appScreen { position: relative; z-index: 1; }
#appScreen.hidden { display: none; }

/* TOPBAR */
.topbar {
  position: sticky; top: 0; z-index: 10;
  background: rgba(247,244,239,.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-logo {
  font-family: 'Noto Serif TC', serif;
  font-size: 16px; font-weight: 600;
  letter-spacing: 3px; color: var(--ink);
}
.topbar-right { display: flex; align-items: center; gap: 12px; }
.sync-indicator { font-size: 10px; color: var(--ink4); display: flex; align-items: center; gap: 4px; letter-spacing: .3px; }
.sync-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sage); flex-shrink: 0; }
.sync-dot.syncing { background: var(--amber); animation: pulse 1.2s infinite; }
.sync-dot.error { background: var(--rust); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; overflow: hidden;
  cursor: pointer; flex-shrink: 0;
  background: var(--surface); color: var(--ink2);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* MONTH NAV */
.month-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 20px 0;
}
.month-btn {
  background: none; border: none; color: var(--ink3);
  width: 36px; height: 36px;
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: background .15s;
}
.month-btn:active { background: var(--border); }
.month-label {
  font-family: 'Noto Serif TC', serif;
  font-size: 20px; font-weight: 600;
  letter-spacing: 2px; color: var(--ink);
}

/* STATS */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px 20px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 14px 16px;
}
.stat-label { font-size: 9px; color: var(--ink4); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
.stat-value { font-size: 18px; font-weight: 400; font-family: 'DM Mono', monospace; color: var(--ink); }
.stat-card.paid .stat-value { color: var(--sage); }
.stat-card.unpaid .stat-value { color: var(--rust); }
.stat-card.progress .stat-value { color: var(--amber); }
.stat-sub { font-size: 10px; color: var(--ink4); margin-top: 4px; }

/* FILTER PILLS */
.filter-row { display: flex; gap: 6px; padding: 0 20px 14px; overflow-x: auto; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.pill {
  background: none; border: 1px solid var(--border2);
  color: var(--ink3); padding: 5px 14px; border-radius: 2px;
  font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  letter-spacing: .5px; font-family: 'Noto Sans TC', sans-serif;
  transition: all .15s;
}
.pill.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* CARD LIST */
.card-list { padding: 0 20px; display: flex; flex-direction: column; gap: 1px; }

/* Group cards with a shared top border */
.card-list::before { content: ''; display: block; height: 1px; background: var(--border); }

.cc-card {
  background: var(--surface);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 16px;
  cursor: pointer; transition: background .12s;
  position: relative;
}
.cc-card:active { background: var(--bg2); }
.cc-card.is-done { border-left: 3px solid var(--sage-mid); }
.cc-card.is-pending { border-left: 3px solid #e8c4b8; }

.cc-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cc-bank { font-size: 14px; font-weight: 500; color: var(--ink); letter-spacing: .3px; }
.cc-due { font-size: 10px; color: var(--ink4); margin-top: 2px; letter-spacing: .3px; }

.badge {
  font-size: 10px; letter-spacing: .8px;
  padding: 3px 8px; border-radius: 2px;
  white-space: nowrap; flex-shrink: 0;
}
.badge-done { background: var(--sage-light); color: var(--sage); }
.badge-pending { background: var(--rust-light); color: var(--rust); }
.badge-zero { background: var(--bg2); color: var(--ink4); }

.cc-card-body { display: flex; align-items: flex-end; justify-content: space-between; }
.cc-amount { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 400; color: var(--ink); }
.cc-amount.zero { font-size: 15px; color: var(--ink4); }
.cc-paid-date { font-size: 10px; color: var(--sage); letter-spacing: .3px; }

.btn-pay {
  margin-top: 12px; width: 100%;
  background: var(--sage-light); border: 1px solid var(--sage-mid);
  color: var(--sage); padding: 10px;
  font-size: 12px; cursor: pointer; letter-spacing: 1px;
  font-family: 'Noto Sans TC', sans-serif;
  border-radius: 2px; transition: background .15s;
}
.btn-pay:active { background: var(--sage-mid); }

.empty-state { text-align: center; padding: 48px 16px; color: var(--ink4); font-size: 13px; letter-spacing: .5px; }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  background: rgba(247,244,239,.97);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-around;
  padding: 10px 0 calc(10px + var(--safe-bottom));
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: var(--ink4); cursor: pointer;
  padding: 4px 12px; font-size: 9px; letter-spacing: 1px;
  font-family: 'Noto Sans TC', sans-serif; transition: color .15s;
  text-transform: uppercase;
}
.nav-btn.active { color: var(--ink); }
.nav-btn .icon { font-size: 18px; }
.nav-btn.center-btn {
  background: var(--ink); color: var(--bg);
  border-radius: 3px; padding: 8px 20px; font-size: 10px;
  letter-spacing: 1.5px; font-weight: 500;
}
.nav-btn.center-btn .icon { font-size: 14px; }

/* SECTION HEADER */
.section-hd {
  font-size: 10px; color: var(--ink4);
  text-transform: uppercase; letter-spacing: 2px;
  padding: 24px 20px 12px;
}

/* HISTORY */
.history-list { padding: 0 20px; }
.history-list::before { content: ''; display: block; height: 1px; background: var(--border); }
.history-item {
  background: var(--surface);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: background .12s;
}
.history-item:active { background: var(--bg2); }
.history-item.cur { border-left: 3px solid var(--ink3); }
.hi-month { font-family: 'Noto Serif TC', serif; font-size: 14px; color: var(--ink); letter-spacing: 1px; }
.hi-pct-text { font-size: 10px; color: var(--ink4); margin-top: 3px; letter-spacing: .3px; }
.hi-bar { height: 2px; background: var(--border); margin-top: 8px; overflow: hidden; width: 80px; }
.hi-bar-fill { height: 100%; background: var(--sage); }
.hi-right { text-align: right; }
.hi-total { font-family: 'DM Mono', monospace; font-size: 16px; color: var(--ink); }
.hi-done { font-size: 10px; color: var(--sage); margin-top: 3px; letter-spacing: .3px; }

/* CARDS MANAGEMENT */
.cards-list { padding: 0 20px; }
.cards-list::before { content: ''; display: block; height: 1px; background: var(--border); }
.card-mgmt-item {
  background: var(--surface);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.card-mgmt-bank { font-size: 14px; font-weight: 500; color: var(--ink); }
.card-mgmt-meta { font-size: 10px; color: var(--ink4); margin-top: 3px; letter-spacing: .3px; }
.card-mgmt-limit { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--ink3); margin-top: 3px; }
.card-mgmt-actions { display: flex; gap: 6px; flex-shrink: 0; }
.btn-sm {
  background: none; border: 1px solid var(--border2);
  color: var(--ink3); padding: 5px 12px;
  font-size: 11px; cursor: pointer; border-radius: 2px;
  font-family: 'Noto Sans TC', sans-serif; letter-spacing: .3px;
  transition: all .12s;
}
.btn-sm:active { background: var(--bg2); }
.btn-sm.danger { color: var(--rust); border-color: #e8c4b8; }
.add-card-row { padding: 12px 20px 0; }
.btn-add-card {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: none; border: 1px solid var(--border2);
  color: var(--ink2); padding: 13px;
  font-size: 13px; cursor: pointer; letter-spacing: 1px;
  font-family: 'Noto Sans TC', sans-serif; width: 100%;
  transition: background .15s;
}
.btn-add-card:active { background: var(--bg2); }

/* MODAL */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(44,40,38,.4); z-index: 100;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 24px 24px calc(24px + var(--safe-bottom));
  width: 100%; max-width: 540px;
  animation: sheetUp .2s ease;
  max-height: 90vh; overflow-y: auto;
}
@keyframes sheetUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.sheet-handle { width: 32px; height: 3px; background: var(--border2); margin: 0 auto 22px; }
.modal h2 {
  font-family: 'Noto Serif TC', serif;
  font-size: 16px; font-weight: 600;
  letter-spacing: 1px; margin-bottom: 20px;
  color: var(--ink);
}
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 10px; color: var(--ink4);
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1.5px;
}
.form-group input, .form-group select {
  width: 100%; background: var(--bg);
  border: none; border-bottom: 1px solid var(--border2);
  color: var(--ink); padding: 10px 0;
  font-size: 16px; font-family: 'Noto Sans TC', sans-serif;
  font-weight: 300; outline: none;
  transition: border-color .2s;
  -webkit-appearance: none; appearance: none;
  border-radius: 0;
}
.form-group input:focus, .form-group select:focus { border-bottom-color: var(--ink2); }
.form-group input[type="date"] { color-scheme: light; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.modal-actions { display: flex; gap: 10px; margin-top: 28px; }
.btn-primary {
  flex: 1; background: var(--ink); border: none; color: var(--bg);
  padding: 14px; font-size: 13px; letter-spacing: 1.5px;
  cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
  font-weight: 400;
}
.btn-cancel {
  background: none; border: 1px solid var(--border2);
  color: var(--ink3); padding: 14px 20px;
  font-size: 13px; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; letter-spacing: .5px;
}
.btn-danger {
  background: none; border: 1px solid #e8c4b8;
  color: var(--rust); padding: 14px 16px;
  font-size: 12px; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
}

.auto-done-hint { font-size: 11px; color: var(--sage); margin-top: 8px; display: none; letter-spacing: .3px; }
.auto-done-hint.show { display: block; }

/* USER MENU */
.user-menu {
  display: none; position: fixed; top: 58px; right: 16px; z-index: 30;
  background: var(--surface); border: 1px solid var(--border);
  padding: 6px; min-width: 160px;
  box-shadow: 0 4px 20px rgba(44,40,38,.1);
}
.user-menu.open { display: block; }
.user-menu-name { font-size: 10px; color: var(--ink4); padding: 8px 12px 4px; letter-spacing: .3px; }
.user-menu-item {
  display: block; width: 100%; text-align: left;
  background: none; border: none; color: var(--ink);
  padding: 10px 12px; font-size: 12px; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; letter-spacing: .3px;
  transition: background .12s;
}
.user-menu-item:hover { background: var(--bg2); }
.user-menu-item.danger { color: var(--rust); }

.export-row { padding: 12px 20px 0; }
.export-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: none; border: 1px solid var(--border2);
  color: var(--ink3); padding: 11px;
  font-size: 11px; cursor: pointer; letter-spacing: 1px;
  font-family: 'Noto Sans TC', sans-serif; width: 100%;
  transition: background .15s;
}
.export-btn:active { background: var(--bg2); }

/* TOAST */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--bg);
  padding: 10px 20px; font-size: 12px; z-index: 300;
  white-space: nowrap; opacity: 0; transition: opacity .25s;
  pointer-events: none; letter-spacing: .5px;
}
.toast.show { opacity: 1; }

#pageHome, #pageHistory, #pageCards { display: none; }
#pageHome.active, #pageHistory.active, #pageCards.active { display: block; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-mark">💳</div>
  <h1 class="login-title">帳單管理</h1>
  <p class="login-sub">使用 Google 帳號登入<br>資料雲端同步，隨時隨地查閱</p>
  <button class="btn-google" onclick="doGoogleLogin()">
    <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    以 Google 帳號登入
  </button>
  <p class="login-note">資料僅供本人存取</p>
</div>

<!-- APP -->
<div id="appScreen" class="hidden">
  <div class="topbar">
    <div class="topbar-logo">帳單管理</div>
    <div class="topbar-right">
      <div class="sync-indicator">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">載入中</span>
      </div>
      <div class="avatar" id="avatarBtn" onclick="toggleUserMenu()"><span id="avatarInitial">—</span></div>
    </div>
  </div>

  <div id="userMenu" class="user-menu">
    <div class="user-menu-name" id="userMenuName">—</div>
    <button class="user-menu-item" onclick="exportCSV();closeUserMenu()">匯出本月 CSV</button>
    <button class="user-menu-item danger" onclick="doSignOut()">登出</button>
  </div>

  <!-- HOME -->
  <div id="pageHome" class="active">
    <div class="month-nav">
      <button class="month-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="stats" id="statsRow"></div>
    <div class="filter-row">
      <button class="pill active" onclick="setFilter('all',this)">全部</button>
      <button class="pill" onclick="setFilter('pending',this)">待繳款</button>
      <button class="pill" onclick="setFilter('done',this)">已繳款</button>
      <button class="pill" onclick="setFilter('zero',this)">無帳單</button>
    </div>
    <div class="card-list" id="cardList"></div>
    <div class="export-row"><button class="export-btn" onclick="exportCSV()">↓ 匯出本月 CSV</button></div>
    <div style="height:20px"></div>
  </div>

  <!-- HISTORY -->
  <div id="pageHistory">
    <div class="section-hd">歷史紀錄</div>
    <div class="history-list" id="historyList"></div>
    <div style="height:20px"></div>
  </div>

  <!-- CARDS MANAGEMENT -->
  <div id="pageCards">
    <div class="section-hd">信用卡管理</div>
    <div class="cards-list" id="cardsMgmtList"></div>
    <div class="add-card-row">
      <button class="btn-add-card" onclick="openAddCardModal()">＋ 新增信用卡</button>
    </div>
    <div style="height:20px"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="navHome" onclick="switchPage('home')">
      <span class="icon">○</span>本月
    </button>
    <button class="nav-btn center-btn" onclick="openBillModal()">
      <span class="icon">✎</span>更新帳單
    </button>
    <button class="nav-btn" id="navHistory" onclick="switchPage('history')">
      <span class="icon">≡</span>歷史
    </button>
    <button class="nav-btn" id="navCards" onclick="switchPage('cards')">
      <span class="icon">◻</span>卡片
    </button>
  </nav>
</div>

<!-- BILL MODAL -->
<div class="modal-overlay" id="billModalOverlay" onclick="closeBillModalOutside(event)">
  <div class="modal">
    <div class="sheet-handle"></div>
    <h2 id="billModalTitle">更新帳單</h2>
    <div class="form-group">
      <label>本月帳單金額</label>
      <input type="number" id="bAmount" placeholder="0" inputmode="numeric" oninput="onAmountInput()">
      <div class="auto-done-hint" id="autoDoneHint">✓ 帳單為 $0，將自動標記為已繳款</div>
    </div>
    <div class="form-group" id="statusGroup">
      <label>繳款狀態</label>
      <select id="bStatus">
        <option value="">待繳款</option>
        <option value="done">已繳款</option>
      </select>
    </div>
    <div class="form-group" id="dateGroup">
      <label>繳款日期</label>
      <input type="date" id="bPaidDate">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeBillModal()">取消</button>
      <button class="btn-primary" onclick="saveBill()">儲存</button>
    </div>
  </div>
</div>

<!-- CARD MODAL -->
<div class="modal-overlay" id="cardModalOverlay" onclick="closeCardModalOutside(event)">
  <div class="modal">
    <div class="sheet-handle"></div>
    <h2 id="cardModalTitle">新增信用卡</h2>
    <div class="form-row">
      <div class="form-group"><label>銀行名稱</label><input type="text" id="cBank" placeholder="玉山銀行"></div>
      <div class="form-group"><label>帳單截止日</label><input type="text" id="cDueDay" placeholder="每月28號"></div>
    </div>
    <div class="form-group"><label>信用額度</label><input type="number" id="cLimit" placeholder="280000" inputmode="numeric"></div>
    <div class="modal-actions" id="cardModalActions">
      <button class="btn-cancel" onclick="closeCardModal()">取消</button>
      <button class="btn-primary" onclick="saveCardDef()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut as fbSignOut }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, collection, getDocs }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey:"AIzaSyDMcegHH3L_yfAXiE7L0myThmMbVGvBsWo",
  authDomain:"nick-card.firebaseapp.com",
  projectId:"nick-card",
  storageBucket:"nick-card.firebasestorage.app",
  messagingSenderId:"1003120846017",
  appId:"1:1003120846017:web:090a72f6d657e1db16e040"
});
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser=null, currentYear, currentMonth, currentFilter='all';
let editingCardId=null, editingBillId=null;
let allData={};

const $    = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
window.showToast = msg => { const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); };
function setSyncStatus(s){ const d=$('syncDot'),l=$('syncLabel'); d.className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':''); l.textContent=s==='syncing'?'儲存中':s==='synced'?'已同步':s==='loading'?'載入中':'錯誤'; }

async function saveKey(key,value){ if(!currentUser)return; setSyncStatus('syncing'); try{ await setDoc(doc(db,'users',currentUser.uid,'data',key),{value}); setSyncStatus('synced'); }catch(e){ setSyncStatus('error'); showToast('儲存失敗：'+e.message); } }
async function loadAllData(){ if(!currentUser)return; setSyncStatus('loading'); try{ const snap=await getDocs(collection(db,'users',currentUser.uid,'data')); allData={}; snap.forEach(d=>{allData[d.id]=d.data().value;}); setSyncStatus('synced'); }catch(e){ setSyncStatus('error'); showToast('載入失敗：'+e.message); } }

getRedirectResult(auth).catch(e=>{ if(e&&e.code!=='auth/no-current-user') showToast('登入失敗：'+e.message); });
onAuthStateChanged(auth, async user=>{
  if(user){ currentUser=user; hide('loginScreen'); show('appScreen'); setupAvatar(user); await loadAllData(); startApp(); }
  else{ currentUser=null; show('loginScreen'); hide('appScreen'); }
});
window.doGoogleLogin=()=>{ const p=new GoogleAuthProvider(); /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)?signInWithRedirect(auth,p):signInWithPopup(auth,p).catch(e=>showToast('登入失敗：'+e.message)); };
window.doSignOut=async()=>{ closeUserMenu(); await fbSignOut(auth); };
function setupAvatar(u){ $('userMenuName').textContent=u.displayName||u.email; if(u.photoURL)$('avatarBtn').innerHTML=`<img src="${u.photoURL}" alt="">`; else $('avatarInitial').textContent=(u.displayName||u.email||'?')[0].toUpperCase(); }
window.toggleUserMenu=()=>$('userMenu').classList.toggle('open');
window.closeUserMenu=()=>$('userMenu').classList.remove('open');
document.addEventListener('click',e=>{ if(!e.target.closest('#avatarBtn')&&!e.target.closest('#userMenu'))closeUserMenu(); });

const getCards=()=>allData['_cards']||[];
const mkKey=(y,m)=>`${y}-${String(m+1).padStart(2,'0')}`;
function getMonthRows(y,m){ const stored=allData[mkKey(y,m)]||[]; return getCards().map(c=>{ const md=stored.find(x=>x.id===c.id)||{amount:0,status:'',paidDate:''}; return{...c,...md}; }); }
async function saveCards(){ await saveKey('_cards',allData['_cards']); }
async function saveMonth(y,m){ await saveKey(mkKey(y,m),allData[mkKey(y,m)]); }
function ensureMonth(y,m){ const key=mkKey(y,m); if(!allData[key]) allData[key]=getCards().map(c=>({id:c.id,amount:0,status:'',paidDate:''})); }

async function seedCards(){
  allData['_cards']=[
    {id:1,bank:'凱基銀行',dueDay:'每月4號',limit:120000},{id:2,bank:'台中銀行',dueDay:'每月5號',limit:60000},
    {id:3,bank:'星展銀行',dueDay:'每月6日',limit:155000},{id:4,bank:'台新銀行',dueDay:'每月7號',limit:100000},
    {id:5,bank:'聯邦銀行',dueDay:'每月9號',limit:150000},{id:6,bank:'第一銀行',dueDay:'每月10號',limit:80000},
    {id:7,bank:'富邦銀行',dueDay:'每月12號',limit:80000},{id:8,bank:'中國信託',dueDay:'每月12號',limit:150000},
    {id:9,bank:'新光銀行',dueDay:'每月15日',limit:90000},{id:10,bank:'樂天銀行',dueDay:'每月15日',limit:50000},
    {id:11,bank:'匯豐銀行',dueDay:'每月15號',limit:100000},{id:12,bank:'上海銀行',dueDay:'每月16號',limit:100000},
    {id:13,bank:'國泰世華',dueDay:'每月17號',limit:60000},{id:14,bank:'華南銀行',dueDay:'每月17號',limit:50000},
    {id:15,bank:'永豐銀行',dueDay:'每月18號',limit:150000},{id:16,bank:'兆豐銀行',dueDay:'每月27日',limit:150000},
    {id:17,bank:'玉山銀行',dueDay:'每月28號',limit:280000},{id:18,bank:'彰化銀行',dueDay:'每月30號',limit:60000},
  ];
  await saveKey('_cards',allData['_cards']);
}

async function startApp(){ const now=new Date(); currentYear=now.getFullYear(); currentMonth=now.getMonth(); if(!getCards().length) await seedCards(); ensureMonth(currentYear,currentMonth); renderAll(); }

function renderAll(){ updateMonthLabel(); renderStats(); renderCards(); renderHistory(); renderCardsMgmt(); }

function updateMonthLabel(){ const M=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月']; $('monthLabel').textContent=`${currentYear} · ${M[currentMonth]}`; }

function renderStats(){
  const rows=getMonthRows(currentYear,currentMonth);
  const total=rows.reduce((s,r)=>s+(r.amount||0),0);
  const paidAmt=rows.filter(r=>r.status==='done').reduce((s,r)=>s+(r.amount||0),0);
  const unpaid=rows.filter(r=>r.status!=='done'&&r.amount>0).reduce((s,r)=>s+(r.amount||0),0);
  const paidCnt=rows.filter(r=>r.status==='done'&&r.amount>0).length;
  const billed=rows.filter(r=>r.amount>0).length;
  const pct=total>0?Math.round(paidAmt/total*100):0;
  $('statsRow').innerHTML=`
    <div class="stat-card total"><div class="stat-label">總帳單</div><div class="stat-value">$${total.toLocaleString()}</div><div class="stat-sub">${rows.length} 張卡</div></div>
    <div class="stat-card paid"><div class="stat-label">已繳款</div><div class="stat-value">$${paidAmt.toLocaleString()}</div><div class="stat-sub">${paidCnt} 張卡</div></div>
    <div class="stat-card unpaid"><div class="stat-label">待繳款</div><div class="stat-value">$${unpaid.toLocaleString()}</div><div class="stat-sub">${rows.filter(r=>r.status!=='done'&&r.amount>0).length} 張卡</div></div>
    <div class="stat-card progress"><div class="stat-label">完成進度</div><div class="stat-value">${pct}%</div><div class="stat-sub">${paidCnt} / ${billed}</div></div>`;
}

function renderCards(){
  const rows=getMonthRows(currentYear,currentMonth);
  const filtered=rows.filter(r=>{
    if(currentFilter==='done') return r.status==='done'||r.amount===0;
    if(currentFilter==='pending') return r.status!=='done'&&r.amount>0;
    if(currentFilter==='zero') return r.amount===0;
    return true;
  });
  const list=$('cardList');
  if(!filtered.length){list.innerHTML='<div class="empty-state">沒有符合的紀錄</div>';return;}
  list.innerHTML=filtered.map(r=>{
    const isZero=r.amount===0;
    const cls=isZero?'':r.status==='done'?'is-done':'is-pending';
    const badge=isZero?'<span class="badge badge-zero">無帳單</span>'
      :r.status==='done'?'<span class="badge badge-done">已繳款</span>'
      :'<span class="badge badge-pending">待繳款</span>';
    const payBtn=(!isZero&&r.status!=='done')?`<button class="btn-pay" onclick="markPaid(${r.id},event)">標記已繳款</button>`:'';
    const paidDateStr=r.paidDate?formatDateDisplay(r.paidDate):'';
    return `<div class="cc-card ${cls}" onclick="openBillModal(${r.id})">
      <div class="cc-card-header">
        <div><div class="cc-bank">${r.bank}</div><div class="cc-due">${r.dueDay}</div></div>
        ${badge}
      </div>
      <div class="cc-card-body">
        <div class="cc-amount ${r.amount>0?'has':'zero'}">${r.amount>0?'$'+r.amount.toLocaleString():'—'}</div>
        <div>${paidDateStr?`<div class="cc-paid-date">${paidDateStr} 繳款</div>`:''}</div>
      </div>${payBtn}</div>`;
  }).join('');
}

function renderHistory(){
  const keys=Object.keys(allData).filter(k=>k!=='_cards').sort().reverse().slice(0,24);
  const curKey=mkKey(currentYear,currentMonth);
  $('historyList').innerHTML=keys.map(key=>{
    const[y,m]=key.split('-').map(Number);
    const rows=getMonthRows(y,m-1);
    const total=rows.reduce((s,r)=>s+(r.amount||0),0);
    const paid=rows.filter(r=>r.status==='done').reduce((s,r)=>s+(r.amount||0),0);
    const pct=total>0?Math.round(paid/total*100):0;
    const M=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    return `<div class="history-item ${key===curKey?'cur':''}" onclick="jumpToMonth('${key}')">
      <div>
        <div class="hi-month">${y} · ${M[parseInt(m)-1]}</div>
        <div class="hi-pct-text">${rows.filter(r=>r.status==='done'&&r.amount>0).length} / ${rows.filter(r=>r.amount>0).length} 張已繳</div>
        <div class="hi-bar"><div class="hi-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="hi-right">
        <div class="hi-total">$${total.toLocaleString()}</div>
        <div class="hi-done">${pct}% 完成</div>
      </div>
    </div>`;
  }).join('')||'<div class="empty-state">尚無歷史紀錄</div>';
}

function renderCardsMgmt(){
  const cards=getCards();
  $('cardsMgmtList').innerHTML=cards.map(c=>`
    <div class="card-mgmt-item">
      <div class="card-mgmt-info">
        <div class="card-mgmt-bank">${c.bank}</div>
        <div class="card-mgmt-meta">${c.dueDay}</div>
        <div class="card-mgmt-limit">$${(c.limit||0).toLocaleString()}</div>
      </div>
      <div class="card-mgmt-actions">
        <button class="btn-sm" onclick="openEditCardModal(${c.id})">編輯</button>
        <button class="btn-sm danger" onclick="deleteCard(${c.id})">刪除</button>
      </div>
    </div>`).join('')||'<div class="empty-state">尚未新增信用卡</div>';
}

function formatDateDisplay(dateStr){
  if(!dateStr) return '';
  if(dateStr.includes('-')&&dateStr.length===10){ const[,m,d]=dateStr.split('-'); return `${parseInt(m)}月${parseInt(d)}日`; }
  return dateStr;
}

window.changeMonth=async d=>{
  currentMonth+=d;
  if(currentMonth>11){currentMonth=0;currentYear++;}
  if(currentMonth<0){currentMonth=11;currentYear--;}
  ensureMonth(currentYear,currentMonth);
  const key=mkKey(currentYear,currentMonth);
  if(!allData[key]||allData[key].length===0){ allData[key]=getCards().map(c=>({id:c.id,amount:0,status:'',paidDate:''})); await saveMonth(currentYear,currentMonth); }
  renderAll(); window.scrollTo({top:0,behavior:'smooth'});
};
window.jumpToMonth=key=>{ const[y,m]=key.split('-').map(Number); currentYear=y; currentMonth=m-1; switchPage('home'); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
window.setFilter=(f,btn)=>{ currentFilter=f; document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderCards(); };
window.markPaid=async(id,e)=>{ e&&e.stopPropagation(); const now=new Date(); const pd=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`; const key=mkKey(currentYear,currentMonth); if(!allData[key])allData[key]=getCards().map(c=>({id:c.id,amount:0,status:'',paidDate:''})); const i=allData[key].findIndex(x=>x.id===id); if(i>=0)Object.assign(allData[key][i],{status:'done',paidDate:pd}); else allData[key].push({id,status:'done',paidDate:pd,amount:0}); renderAll(); await saveMonth(currentYear,currentMonth); showToast('已標記繳款完成'); };
window.switchPage=page=>{ ['home','history','cards'].forEach(p=>{ $('page'+p.charAt(0).toUpperCase()+p.slice(1)).classList.toggle('active',p===page); $('nav'+p.charAt(0).toUpperCase()+p.slice(1)).classList.toggle('active',p===page); }); };

window.openBillModal=id=>{
  if(id===undefined){ showToast('請點擊卡片來更新帳單'); return; }
  editingBillId=id;
  const r=getMonthRows(currentYear,currentMonth).find(x=>x.id===id);
  if(!r)return;
  $('billModalTitle').textContent=r.bank;
  $('bAmount').value=r.amount||'';
  $('bStatus').value=r.status==='done'?'done':'';
  if(r.paidDate&&r.paidDate.includes('-')){ $('bPaidDate').value=r.paidDate; } else{ $('bPaidDate').value=''; }
  updateAutoDoneHint(); updateStatusDateVisibility();
  $('billModalOverlay').classList.add('open');
};
window.closeBillModal=()=>$('billModalOverlay').classList.remove('open');
window.closeBillModalOutside=e=>{ if(e.target===$('billModalOverlay'))closeBillModal(); };
window.onAmountInput=()=>{ updateAutoDoneHint(); updateStatusDateVisibility(); };
function updateAutoDoneHint(){ const amt=parseInt($('bAmount').value)||0; $(amt===0?'autoDoneHint':'autoDoneHint').classList.toggle('show',amt===0); }
function updateStatusDateVisibility(){ const amt=parseInt($('bAmount').value)||0; $('statusGroup').style.display=amt===0?'none':''; $('dateGroup').style.display=amt===0?'none':''; }

window.saveBill=async()=>{
  const amount=parseInt($('bAmount').value)||0;
  let status=$('bStatus').value;
  let paidDate=$('bPaidDate').value;
  if(amount===0){ status='done'; if(!paidDate){ const now=new Date(); paidDate=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`; } }
  const key=mkKey(currentYear,currentMonth);
  if(!allData[key])allData[key]=[];
  const i=allData[key].findIndex(x=>x.id===editingBillId);
  const row={id:editingBillId,amount,status,paidDate};
  if(i>=0)allData[key][i]=row; else allData[key].push(row);
  closeBillModal(); renderAll();
  await saveMonth(currentYear,currentMonth);
  showToast('已儲存');
};

window.openAddCardModal=()=>{ editingCardId=null; $('cardModalTitle').textContent='新增信用卡'; $('cBank').value=''; $('cDueDay').value=''; $('cLimit').value=''; $('cardModalActions').innerHTML=`<button class="btn-cancel" onclick="closeCardModal()">取消</button><button class="btn-primary" onclick="saveCardDef()">儲存</button>`; $('cardModalOverlay').classList.add('open'); };
window.openEditCardModal=id=>{ editingCardId=id; const c=getCards().find(x=>x.id===id); if(!c)return; $('cardModalTitle').textContent=c.bank; $('cBank').value=c.bank; $('cDueDay').value=c.dueDay; $('cLimit').value=c.limit||''; $('cardModalActions').innerHTML=`<button class="btn-danger" onclick="deleteCard(${id});closeCardModal()">刪除</button><button class="btn-cancel" onclick="closeCardModal()">取消</button><button class="btn-primary" onclick="saveCardDef()">儲存</button>`; $('cardModalOverlay').classList.add('open'); };
window.closeCardModal=()=>$('cardModalOverlay').classList.remove('open');
window.closeCardModalOutside=e=>{ if(e.target===$('cardModalOverlay'))closeCardModal(); };

window.saveCardDef=async()=>{
  const bank=$('cBank').value.trim(), dueDay=$('cDueDay').value.trim(), limit=parseInt($('cLimit').value)||0;
  if(!bank){alert('請填寫銀行名稱');return;}
  if(!allData['_cards'])allData['_cards']=[];
  if(editingCardId){
    const ci=allData['_cards'].findIndex(c=>c.id===editingCardId);
    if(ci>=0)Object.assign(allData['_cards'][ci],{bank,dueDay,limit});
  } else {
    const id=Math.max(0,...allData['_cards'].map(c=>c.id))+1;
    allData['_cards'].push({id,bank,dueDay,limit});
    for(const k of Object.keys(allData)){ if(k!=='_cards'&&Array.isArray(allData[k]))allData[k].push({id,amount:0,status:'',paidDate:''}); }
    ensureMonth(currentYear,currentMonth);
  }
  closeCardModal(); renderAll();
  await saveCards();
  showToast(editingCardId?'已更新':'已新增');
};

window.deleteCard=async id=>{ if(!confirm('確定要刪除這張卡？'))return; allData['_cards']=(allData['_cards']||[]).filter(c=>c.id!==id); for(const k of Object.keys(allData)){ if(k!=='_cards'&&Array.isArray(allData[k]))allData[k]=allData[k].filter(r=>r.id!==id); } renderAll(); await saveCards(); for(const k of Object.keys(allData)){ if(k!=='_cards')await saveKey(k,allData[k]); } showToast('已刪除'); };

window.exportCSV=()=>{
  const rows=getMonthRows(currentYear,currentMonth);
  const M=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const lines=['\uFEFF信用卡繳費紀錄 - '+currentYear+'年'+M[currentMonth],'銀行,繳費日,信用額度,帳單金額,繳款狀態,繳款日期',...rows.map(r=>[r.bank,r.dueDay,r.limit,r.amount,r.status==='done'?'已繳款':r.amount===0?'無帳單':'待繳款',r.paidDate?formatDateDisplay(r.paidDate):''].join(','))];
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`帳單_${currentYear}${String(currentMonth+1).padStart(2,'0')}.csv`; a.click(); URL.revokeObjectURL(url);
  showToast('CSV 已下載');
};
</script>
</body>
</html>
